[project]
name = "eclipse-ditto-mcp-server"
version = "0.1.1"
description = "MCP server for the Eclipse Ditto digital twin HTTP API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nagarjun Rajendran" }]
keywords = ["mcp", "model-context-protocol", "eclipse-ditto", "digital-twin", "iot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=2.13.0",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/nagarjunr/iot-mcp-servers/tree/main/eclipse-ditto"
Repository = "https://github.com/nagarjunr/iot-mcp-servers"

[project.scripts]
eclipse-ditto-mcp-server = "dittomcpserver:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["dittomcpserver.py"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
