[project]
name = "azure-iot-hub-mcp-server"
version = "0.1.0"
description = "MCP server for Azure IoT Hub (device registry, twins, direct methods, jobs, messaging)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nagarjun Rajendran" }]
keywords = ["mcp", "model-context-protocol", "azure", "azure-iot-hub", "iot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=2.13.0",
    "httpx>=0.28.1",
    "python-qpid-proton>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/nagarjunr/iot-mcp-servers/tree/main/azure-iot-hub"
Repository = "https://github.com/nagarjunr/iot-mcp-servers"

[project.scripts]
azure-iot-hub-mcp-server = "azureiothubmcpserver:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.21.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["azureiothubmcpserver.py"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
