name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.find.outputs.servers }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          servers=$(find . -maxdepth 1 -mindepth 1 -type d -not -path './.git' -not -path './.github' -exec test -e '{}/pyproject.toml' \; -print | sed 's|^\./||' | jq -R -s -c 'split("\n")[:-1]')
          echo "servers=$servers" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: needs.discover.outputs.servers != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: ${{ fromJson(needs.discover.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: ${{ matrix.server }}
        run: uv sync --dev

      - name: Lint (ruff)
        working-directory: ${{ matrix.server }}
        run: uv run ruff check .

      - name: Type check (mypy)
        working-directory: ${{ matrix.server }}
        run: uv run mypy . --ignore-missing-imports

      - name: Run tests
        working-directory: ${{ matrix.server }}
        run: uv run pytest -v
