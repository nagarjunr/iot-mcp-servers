[project]
name = "aws-iot-core-mcp-server"
version = "0.1.0"
description = "MCP server for AWS IoT Core (device registry, shadows, jobs, rules, messaging)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nagarjun Rajendran" }]
keywords = ["mcp", "model-context-protocol", "aws", "aws-iot-core", "iot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "boto3>=1.34.0",
    "fastmcp>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/nagarjunr/iot-mcp-servers/tree/main/aws-iot-core"
Repository = "https://github.com/nagarjunr/iot-mcp-servers"

[project.scripts]
aws-iot-core-mcp-server = "awsiotcoremcpserver:main"

[dependency-groups]
dev = [
    "moto>=5.2.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["awsiotcoremcpserver.py"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
