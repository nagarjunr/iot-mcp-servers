# Mosquitto config for local testing of the sparkplug-b MCP server.
# Anonymous/plain-text only - this is a throwaway broker for exercising the
# Sparkplug B protocol locally, not a security example. For production auth
# (username/password, TLS) see the mqtt/ server's docker/mosquitto.conf and
# this server's README env vars.

persistence false
log_dest stdout

listener 1883
allow_anonymous true
