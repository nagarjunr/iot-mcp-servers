# Mosquitto config for local testing of the mqtt MCP server.
# Self-signed test certs under docker/certs/ are NOT real secrets: CN=localhost,
# generated purely to exercise this connector's TLS/mTLS code paths locally.

persistence false
log_dest stdout

# Plain listener with username/password auth.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# TLS listener (server auth only, no client cert required).
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
