[project]
name = "mqtt5-mcp-server"
version = "0.1.0"
description = "MCP server for MQTT brokers (publish, subscribe, topic discovery)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nagarjun Rajendran" }]
keywords = ["mcp", "model-context-protocol", "mqtt", "iot", "pubsub"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=2.13.0",
    "paho-mqtt>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/nagarjunr/iot-mcp-servers/tree/main/mqtt"
Repository = "https://github.com/nagarjunr/iot-mcp-servers"

[project.scripts]
mqtt5-mcp-server = "mqttmcpserver:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["mqttmcpserver.py"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
